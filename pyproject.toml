[project]
name = "houseprices"
version = "0.1.0"
description = "Kaggle House Prices: baseline + validation protocol (ITMO ML R&D, HW1)"
authors = [{ name = "Aleksandr Tarmaev" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pandas (>=3.1.1,<4.0.0)", "numpy (>=2.5.4,<3.0.0)", "scikit-learn (>=1.9.1,<2.0.0)", "pyyaml (>=6.0.3,<7.0.0)", "matplotlib (>=3.11.2,<4.0.0)", "seaborn (>=0.13.2,<0.14.0)", "kaggle (>=2.2.5,<3.0.0)", "scipy (>=1.18.1,<2.0.0)"]

[tool.poetry]
package-mode = false
[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.6.5"
ipykernel = "^7.4.0"

